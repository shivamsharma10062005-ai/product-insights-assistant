# Render Blueprint (https://render.com/docs/blueprint-spec).
# Deploy: push this repo to GitHub, then in Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file
# and provisions the service automatically. See DEPLOYMENT.md for the
# full walkthrough, including where to set ANTHROPIC_API_KEY and
# ALLOWED_ORIGINS as secrets after the service exists.
services:
  - type: web
    name: product-insights-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements-backend.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ANTHROPIC_API_KEY
        sync: false   # set manually in the Render dashboard -- never commit real keys
      - key: ALLOWED_ORIGINS
        sync: false   # set to your Streamlit app's URL after the frontend is deployed
