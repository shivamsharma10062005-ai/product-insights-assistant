name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-backend.txt pytest

      - name: Run analytics unit tests
        run: pytest analytics/tests/ -v

      - name: Smoke-test data generation
        run: python data/generate_data.py
